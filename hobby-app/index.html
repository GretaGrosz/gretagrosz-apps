<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Blank" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Blank</title>
    <meta name="description" content="Pick a hobby, follow a plan step by step, keep a photo diary and get a before-and-after reel when you finish." />
    <link rel="canonical" href="https://gretagrosz.com/blank/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Greta Grosz" />
    <meta property="og:title" content="Blank" />
    <meta property="og:description" content="Pick a hobby, follow a plan step by step, keep a photo diary and get a before-and-after reel when you finish." />
    <meta property="og:url" content="https://gretagrosz.com/blank/" />
    <meta property="og:image" content="https://gretagrosz.com/blank/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <style>
      html { background: #f2f2f7; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #000; } }
      html[data-theme='dark'] { background: #000; }
    </style>
    <script>
      try { var t = localStorage.getItem('blank-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
