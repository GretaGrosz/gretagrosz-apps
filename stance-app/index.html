<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Agora" />
    <title>Agora</title>
    <meta name="description" content="One big question a day. Take a side, argue it, and practise speaking for the Matura." />
    <link rel="canonical" href="https://gretagrosz.com/stance/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Agora" />
    <meta property="og:description" content="One big question a day. Take a side, argue it, and practise speaking for the Matura." />
    <meta property="og:url" content="https://gretagrosz.com/stance/" />
    <meta property="og:image" content="https://gretagrosz.com/stance/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="32x32" href="/stance/icon-32.png" />
    <link rel="apple-touch-icon" href="/stance/icon-180.png" />
    <link rel="manifest" href="/stance/manifest.webmanifest" />
    <style>
      html { background: #F2F2F7; color: #000; }
      @media (prefers-color-scheme: dark) { html { background: #000; color: #fff; } }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; }
      /* What shows before the JavaScript arrives: the shape of Today, no spinner */
      .shell { max-width: 600px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 22px) 16px 0; }
      .shell .t { width: 42%; height: 13px; margin-left: 4px; border-radius: 6px; background: rgba(118,118,128,.16); }
      .shell .h { width: 40%; height: 34px; margin: 10px 4px 16px; border-radius: 10px; background: rgba(118,118,128,.16); }
      .shell i { display: block; height: 300px; border-radius: 22px; background: #fff; }
      .shell b { position: fixed; left: 16px; right: 16px; bottom: max(14px, env(safe-area-inset-bottom)); max-width: 360px; height: 62px; margin: 0 auto; border-radius: 999px; background: rgba(250,250,252,.84); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08); }
      @media (prefers-color-scheme: dark) { .shell i { background: #1C1C1E; } .shell .t, .shell .h { background: rgba(118,118,128,.28); } .shell b { background: rgba(28,28,30,.82); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="shell" aria-hidden="true"><div class="t"></div><div class="h"></div><i></i><b></b></div></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
